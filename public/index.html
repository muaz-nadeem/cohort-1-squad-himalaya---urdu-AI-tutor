<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MDCAT Biology Urdu Tutor</title>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 460px;
      width: 100%;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.25rem;
      color: #f8fafc;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
    }

    /* Mic button */
    .mic-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid #334155;
      background: #1e293b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      transition: all 0.3s ease;
      position: relative;
    }
    .mic-btn:hover { border-color: #22d3ee; }
    .mic-btn.connected { border-color: #22d3ee; background: #164e63; }
    .mic-btn.speaking {
      border-color: #22d3ee;
      box-shadow: 0 0 0 8px rgba(34,211,238,0.15), 0 0 0 16px rgba(34,211,238,0.07);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 8px rgba(34,211,238,0.15), 0 0 0 16px rgba(34,211,238,0.07); }
      50% { box-shadow: 0 0 0 12px rgba(34,211,238,0.25), 0 0 0 24px rgba(34,211,238,0.1); }
    }
    .mic-btn svg { width: 40px; height: 40px; fill: #94a3b8; transition: fill 0.3s; }
    .mic-btn.connected svg, .mic-btn.speaking svg { fill: #22d3ee; }

    #status {
      font-size: 1rem;
      color: #94a3b8;
      min-height: 1.5rem;
      margin-bottom: 1rem;
    }
    #status.active { color: #22d3ee; }
    #status.error { color: #f87171; }

    .log {
      text-align: right;
      direction: rtl;
      max-height: 200px;
      overflow-y: auto;
      padding: 1rem;
      background: #1e293b;
      border-radius: 12px;
      font-size: 0.85rem;
      line-height: 1.7;
      color: #cbd5e1;
    }
    .log:empty { display: none; }
    .log p { margin-bottom: 0.4rem; }
    .log .agent { color: #22d3ee; }
  </style>
</head>
<body>
  <div class="container">
    <h1>MDCAT Biology ٹیوٹر</h1>
    <p class="subtitle">اردو میں بائیولوجی سیکھیں</p>

    <button class="mic-btn" id="micBtn" onclick="toggleConnection()">
      <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>

    <div id="status">مائیک پر کلک کریں</div>
    <div class="log" id="log"></div>
  </div>

  <script>
    const BACKEND = window.location.origin;
    let room = null;
    let connected = false;

    const micBtn = document.getElementById('micBtn');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');

    function setStatus(text, cls = '') {
      statusEl.textContent = text;
      statusEl.className = cls;
    }

    function appendLog(text, isAgent = false) {
      const p = document.createElement('p');
      p.textContent = text;
      if (isAgent) p.classList.add('agent');
      logEl.prepend(p);
    }

    async function toggleConnection() {
      if (connected) {
        disconnect();
      } else {
        await connectToTutor();
      }
    }

    async function connectToTutor() {
      try {
        setStatus('...سیشن بن رہا ہے', 'active');

        const res = await fetch(`${BACKEND}/api/session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ participantName: 'Student' }),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Session creation failed');
        }

        const session = await res.json();

        room = new LivekitClient.Room({
          audioCaptureDefaults: { autoGainControl: true, noiseSuppression: true },
          audioOutput: { deviceId: '' },
        });

        room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
          if (track.kind === 'audio') {
            const el = track.attach();
            document.body.appendChild(el);
          }
        });

        room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
          track.detach().forEach(el => el.remove());
        });

        room.on(LivekitClient.RoomEvent.Disconnected, () => {
          connected = false;
          micBtn.classList.remove('connected', 'speaking');
          setStatus('سیشن ختم ہو گیا');
        });

        room.on(LivekitClient.RoomEvent.DataReceived, (payload, participant) => {
          try {
            const msg = JSON.parse(new TextDecoder().decode(payload));
            if (msg.text) {
              appendLog(msg.text, participant?.identity !== 'Student');
            }
          } catch {}
        });

        await room.connect(session.wsUrl, session.token);
        await room.localParticipant.setMicrophoneEnabled(true);

        connected = true;
        micBtn.classList.add('connected');
        setStatus('بولیں — ٹیوٹر سن رہا ہے', 'active');
        appendLog('سیشن شروع ہو گیا');

      } catch (err) {
        console.error(err);
        setStatus(err.message, 'error');
      }
    }

    function disconnect() {
      if (room) {
        room.disconnect();
        room = null;
      }
      connected = false;
      micBtn.classList.remove('connected', 'speaking');
      setStatus('مائیک پر کلک کریں');
    }
  </script>
</body>
</html>
